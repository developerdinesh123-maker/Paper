<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice Intelligence</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}main{max-width:1100px;margin:auto;padding:28px}
.card{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 14px #0001}
textarea{width:100%;min-height:90px;padding:12px;border:1px solid #ccd3df;border-radius:10px;box-sizing:border-box}
button{background:#172033;color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:16px}th,td{border:1px solid #dce1e8;padding:9px;text-align:left}
.small{color:#687386}.error{color:#b42318}
</style></head><body><main>
<h1>Invoice Intelligence</h1>
<p class="small">Upload invoices, packing lists and related documents. Tell the AI exactly what you need.</p>
<div class="card">
<b>What data do you need?</b>
<textarea id="request">Extract invoice number, invoice date, supplier name, GSTIN, total amount, and net weight. Get net weight from the packing list when available.</textarea>
<p><input id="files" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp"></p>
<button onclick="extract()">Extract data</button> <span id="status" class="small"></span>
</div>
<div class="card" id="results" style="display:none"><h2>Results</h2><button onclick="downloadJSON()">Download JSON</button><div id="table"></div></div>
</main>
<script>
let last=null;
async function extract(){
 const fs=document.getElementById('files').files;if(!fs.length){alert('Select documents first');return}
 const fd=new FormData();fd.append('request',document.getElementById('request').value);
 for(const f of fs)fd.append('files',f);
 document.getElementById('status').textContent=' Processing...';
 try{const r=await fetch('/api/extract',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw Error(j.detail||'Extraction failed');
 last=j;render(j.records||[]);document.getElementById('status').textContent=' Done';
 }catch(e){document.getElementById('status').innerHTML='<span class="error">'+e.message+'</span>'}
}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(rows){
 document.getElementById('results').style.display='block';if(!rows.length){document.getElementById('table').textContent='No records';return}
 const keys=[...new Set(rows.flatMap(r=>Object.keys(r.fields||{})))];
 let h='<table><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'<th>Confidence</th><th>Warnings</th></tr>';
 for(const r of rows)h+='<tr>'+keys.map(k=>'<td>'+esc(JSON.stringify(r.fields?.[k]??null))+'</td>').join('')+'<td>'+esc(r.confidence??'')+'</td><td>'+esc((r.warnings||[]).join('; '))+'</td></tr>';
 document.getElementById('table').innerHTML=h+'</table>';
}
function downloadJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));a.download='invoice-extraction.json';a.click()}
</script></body></html>
